<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مخزن المحل</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#15212c; --muted:#5d6b78; --line:#d9dfe5;
  --accent:#f2b100; --on-accent:#1a1400; --accent-soft:#fff1c2; --tile:#e3e8ed;
  --ok:#167a45; --bad:#c2352b; --on-bad:#ffffff; --warn:#8f5200; --scrim:rgba(10,16,22,.55);
  --f-body:'Tajawal',system-ui,Tahoma,'Segoe UI',sans-serif;
  --f-head:'Cairo','Tajawal',system-ui,Tahoma,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f161d; --surface:#17212b; --ink:#e9eef2; --muted:#93a1ae; --line:#263340;
    --accent:#f5b800; --on-accent:#1a1400; --accent-soft:#2e2606; --tile:#1f2c38;
    --ok:#4cc487; --bad:#ff7a6e; --on-bad:#2a0a07; --warn:#f0a640; --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#17212b; --ink:#e9eef2; --muted:#93a1ae; --line:#263340;
  --accent:#f5b800; --on-accent:#1a1400; --accent-soft:#2e2606; --tile:#1f2c38;
  --ok:#4cc487; --bad:#ff7a6e; --on-bad:#2a0a07; --warn:#f0a640; --scrim:rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:400 16px/1.55 var(--f-body); direction:rtl;
  padding-block:8px 150px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#app{max-width:560px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance}
small{color:var(--muted)}
.top{display:flex;align-items:center;gap:10px;padding:10px 0 12px}
.top h1{font-size:1.5rem;font-weight:800;flex:1;min-width:0}
.iconbtn{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;min-width:0}
.tile b{font-family:var(--f-head);font-size:1.1rem}
.tile.add{border-style:dashed;justify-content:center;color:var(--muted);min-height:170px}
.logo{width:88px;height:88px;border-radius:50%;background:var(--tile);display:grid;place-items:center;overflow:hidden;color:var(--ink)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.edit{position:absolute;top:6px;left:6px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);cursor:pointer;padding:0}
.dot{position:absolute;top:12px;right:12px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.ph{aspect-ratio:1/1;max-width:100%;background:var(--tile);display:grid;place-items:center;position:relative;color:var(--muted)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.pc .info{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pc b{font-weight:700;font-size:.95rem;overflow-wrap:anywhere;line-height:1.35}
.tag{position:absolute;top:8px;right:8px;background:var(--bad);color:var(--on-bad);font-size:.75rem;padding:1px 9px;border-radius:999px;font-style:normal;font-weight:700}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btns .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;min-width:0}
.fld label{font-size:.9rem;color:var(--muted)}
input,select{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;width:100%;min-width:0}
textarea{border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 12px;width:100%;min-height:110px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ov{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding-top:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet h2{font-size:1.25rem;margin-bottom:12px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:2px;padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 0;color:var(--muted);font-size:.78rem;cursor:pointer;min-height:52px;border-radius:10px}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.cartbar{position:fixed;left:0;right:0;z-index:19;bottom:calc(68px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cartbar .btn{max-width:560px;margin:0 auto;display:flex;width:100%;justify-content:space-between;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.alert{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--f-head);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat.hot{border-color:var(--accent)}
.sec{font-family:var(--f-head);font-size:1.1rem;margin:22px 0 8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.li{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li.tap{cursor:pointer}
.li .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.li .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;white-space:nowrap;cursor:pointer;min-height:42px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums;text-align:left}
.pmain{aspect-ratio:4/3;max-width:100%;border-radius:14px;overflow:hidden;background:var(--tile);margin-bottom:8px;display:grid;place-items:center;color:var(--muted)}
.pmain img{width:100%;height:100%;object-fit:contain;display:block}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.th{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.thw{position:relative;width:72px;height:72px}
.thw img{width:100%;height:100%;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.thw button{position:absolute;top:-6px;left:-6px;width:28px;height:28px;border-radius:50%;border:0;background:var(--bad);color:var(--on-bad);font-weight:700;cursor:pointer;line-height:1}
.addimg{width:72px;height:72px;border-radius:12px;border:1.5px dashed var(--muted);display:grid;place-items:center;color:var(--muted);cursor:pointer}
.step{display:grid;grid-template-columns:48px 1fr 48px;gap:8px}
.step input{text-align:center;font-size:1.2rem;font-weight:700}
.qin{width:72px;text-align:center;padding:0 6px}
.badge{display:inline-block;padding:1px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-size:.8rem;font-weight:700}
.badge.bad{background:var(--bad);color:var(--on-bad)}
.neg{color:var(--bad)}
.pos{color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:28px 8px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:60;font-weight:700;max-width:90%;text-align:center}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.syncbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:.88rem}
@media (prefers-reduced-motion:no-preference){.ov{animation:fade .15s ease-out}@keyframes fade{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>

<div id="app"><main id="main"><div class="empty">جاري التحميل...</div></main></div>
<div id="cartbar" class="cartbar" hidden></div>
<nav class="nav" id="nav" aria-label="التنقل"></nav>
<div id="ov" class="ov" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

'use strict';
(function(){
/* ---------- Supabase & remote control config ---------- */
const SUPABASE_URL = 'https://mjxtpohouybxvxnbryyq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_S4P-d5shnyXdEOhiFJ9wFg_fd4pNfdz';
const IMAGE_BUCKET = 'shop-images';
const sb = (SUPABASE_URL.indexOf('http') === 0 && SUPABASE_ANON_KEY && SUPABASE_ANON_KEY !== 'YOUR_SUPABASE_ANON_KEY')
  ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

const CONTROL_URL = 'https://gist.githubusercontent.com/Engtamernagi/f42080a8cb70ecc70e7ed9d1eae0e49b/raw/shop-control.json';
let ACCESS = {
  active: true,
  message: 'تم إيقاف تشغيل التطبيق مؤقتاً، يرجى التواصل مع الإدارة.',
  features: {
    sale: true,
    customers: true,
    salaries: true,
    backup: true,
    editStock: true,
    cancelInvoice: true
  }
};
const canUse = feat => !(ACCESS && ACCESS.features && ACCESS.features[feat] === false);
function renderLockedScreen(msg){
  const b=$('#cartbar'); if(b) b.hidden=true;
  const n=$('#nav'); if(n) n.innerHTML='';
  const o=$('#ov'); if(o){ o.hidden=true; o.innerHTML=''; }
  $('#main').innerHTML =
    '<div class="hero" style="margin-top:40px;text-align:center;padding:24px">' +
      '<h2 style="margin-bottom:10px">التطبيق متوقف حالياً</h2>' +
      '<p style="margin:0;color:var(--muted)">' + esc(msg || ACCESS.message) + '</p>' +
    '</div>';
}
async function checkRemoteAccess(){
  if(!CONTROL_URL || CONTROL_URL.indexOf('http') !== 0) return true;
  try{
    const sep = CONTROL_URL.indexOf('?') > -1 ? '&' : '?';
    const res = await fetch(CONTROL_URL + sep + 't=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) return true;
    const cfg = await res.json();
    ACCESS = Object.assign({}, ACCESS, cfg, {
      features: Object.assign({}, ACCESS.features, (cfg && cfg.features) || {})
    });
    if(ACCESS.active === false){
      renderLockedScreen(ACCESS.message);
      return false;
    }
    return true;
  }catch(e){
    return true;
  }
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AD='٠١٢٣٤٥٦٧٨٩';
function num(v){const s=String(v==null?'':v).replace(/[٠-٩]/g,d=>AD.indexOf(d)).replace(/[٫،,]/g,'.').trim();const n=parseFloat(s);return isFinite(n)?n:0}
const r3=x=>Math.round(x*1000)/1000;
const fmt=n=>(Math.round((Number(n)||0)*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const money=n=>fmt(n)+' ج';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const fdate=iso=>{const d=new Date(iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const UNITS=['قطعة','متر','لتر','جردل','جالون','علبة','لفة','كيلو','طن','كيس','طقم'];
const PATHS={
 stock:'<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>',
 sale:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/>',
 report:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 cust:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14.5c2.4.6 3.5 2.6 3.5 5.5"/>',
 more:'<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
 back:'<path d="M9 5l7 7-7 7"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>',
 camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
 box:'<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/>',
 paint:'<rect x="3" y="3" width="15" height="6" rx="1.5"/><path d="M18 6h3v6H11v3"/><rect x="9" y="15" width="4" height="6" rx="1"/>',
 bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/>',
 drop:'<path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/>',
 iron:'<path d="M12 2l8 4.5v9L12 20l-8-4.5v-9L12 2z"/><circle cx="12" cy="11" r="3"/>'
};
const ic=(n,s)=>'<svg width="'+(s||24)+'" height="'+(s||24)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(PATHS[n]||PATHS.box)+'</svg>';

/* ---------- state ---------- */
const emptyState=()=>({depts:[],products:[],purchases:[],invoices:[],customers:[],payments:[],salaries:[],invSeq:0,shop:'',imgUrls:{}});
let S=emptyState();
let V={tab:'stock',dept:null,q:'',period:'today',cart:[],cur:null};
const newCO=()=>({type:'cash',cust:'',newName:'',phone:'',disc:'',paid:''});
let CO=newCO();
let F=null, DF=null, persist=true, db=null, saveT=null, cloudT=null;
let currentUser=null, authMode='login', syncStatus='جاهز';
const imgCache={}, imgBlobs={};

const D=id=>S.depts.find(d=>d.id===id);
const P_=id=>S.products.find(p=>p.id===id);
const C_=id=>S.customers.find(c=>c.id===id);
const low=p=>p.qty<=(p.min||0);
function bal(cid){let b=0;S.invoices.forEach(i=>{if(i.cust===cid&&!i.cancelled)b+=i.total-i.paid});S.payments.forEach(p=>{if(p.cust===cid)b-=p.amount});return b}
function getImgSrc(id){
  if(!id)return null;
  if(imgCache[id])return imgCache[id];
  if(S.imgUrls&&S.imgUrls[id])return S.imgUrls[id];
  return null;
}

/* ---------- storage (IndexedDB + Supabase Cloud) ---------- */
function openDB(){return new Promise((res,rej)=>{if(!window.indexedDB){rej(new Error('no idb'));return}const r=indexedDB.open('shop-app',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('img')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idb(store,mode,fn){return new Promise((res,rej)=>{const tx=db.transaction(store,mode);const st=tx.objectStore(store);const rq=fn(st);tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
const idbGet=(s,k)=>idb(s,'readonly',st=>st.get(k));
const idbPut=(s,k,v)=>idb(s,'readwrite',st=>st.put(v,k));
const idbDel=(s,k)=>idb(s,'readwrite',st=>st.delete(k));
const idbClear=s=>idb(s,'readwrite',st=>st.clear());
function idbLoadAllImgs(){
  return new Promise((res,rej)=>{
    const tx=db.transaction('img','readonly');
    const st=tx.objectStore('img');
    const keysReq=st.getAllKeys();
    const valsReq=st.getAll();
    tx.oncomplete=()=>{
      const keys=keysReq.result||[];
      const vals=valsReq.result||[];
      for(let i=0;i<keys.length;i++){
        imgBlobs[keys[i]]=vals[i];
        imgCache[keys[i]]=URL.createObjectURL(vals[i]);
      }
      res();
    };
    tx.onerror=()=>rej(tx.error);
    tx.onabort=()=>rej(tx.error);
  });
}

async function uploadImageToCloud(id, blob){
  if(!sb || !currentUser || !blob)return null;
  const path = currentUser.id + '/' + id + '.jpg';
  const { error } = await sb.storage.from(IMAGE_BUCKET).upload(path, blob, {
    contentType: blob.type || 'image/jpeg',
    upsert: true
  });
  if(error)throw error;
  const { data } = sb.storage.from(IMAGE_BUCKET).getPublicUrl(path);
  return data && data.publicUrl ? data.publicUrl : null;
}

async function deleteImageFromCloud(id){
  if(!sb || !currentUser || !id)return;
  const path = currentUser.id + '/' + id + '.jpg';
  await sb.storage.from(IMAGE_BUCKET).remove([path]).catch(()=>{});
}

async function pushCloudState(){
  if(!sb || !currentUser)return;
  syncStatus='جاري المزامنة...';
  renderSyncBar();
  try{
    if(!S.imgUrls)S.imgUrls={};
    for(const id of Object.keys(imgBlobs)){
      if(!S.imgUrls[id]){
        const url = await uploadImageToCloud(id, imgBlobs[id]);
        if(url)S.imgUrls[id]=url;
      }
    }
    const { error } = await sb.from('user_states').upsert({
      user_id: currentUser.id,
      state: S,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id' });
    if(error)throw error;
    syncStatus='محفوظ على السحابة';
  }catch(e){
    syncStatus='تعذرت المزامنة';
  }
  renderSyncBar();
}

function scheduleCloudSave(){
  if(!sb || !currentUser)return;
  clearTimeout(cloudT);
  cloudT=setTimeout(pushCloudState, 500);
}

function flush(){
  if(persist&&db){
    try{idbPut('kv','state',S).catch(()=>{persist=false})}catch(e){persist=false}
  }
  scheduleCloudSave();
}
function save(){clearTimeout(saveT);saveT=setTimeout(flush,120)}
document.addEventListener('visibilitychange',()=>{if(document.hidden){flush();pushCloudState()}});
window.addEventListener('pagehide',()=>{flush();pushCloudState()});

async function addImage(blob){
  const id=uid();
  imgBlobs[id]=blob;
  imgCache[id]=URL.createObjectURL(blob);
  if(persist&&db){try{await idbPut('img',id,blob)}catch(e){persist=false}}
  if(sb && currentUser){
    try{
      const url=await uploadImageToCloud(id, blob);
      if(url){
        if(!S.imgUrls)S.imgUrls={};
        S.imgUrls[id]=url;
      }
    }catch(e){}
  }

function delImage(id){

function resizeImage(file,max){max=max||560;return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const w=Math.round(im.width*k),h=Math.round(im.height*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);c.toBlob(b=>{URL.revokeObjectURL(url);b?res(b):rej(new Error('blob'))},'image/jpeg',0.78)};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};im.src=url})}

/* ---------- auth & cloud hydration ---------- */
function hasLocalShopData(st){
  if(!st)return false;
  return Boolean((st.products&&st.products.length)||(st.invoices&&st.invoices.length)||(st.customers&&st.customers.length)||(st.purchases&&st.purchases.length)||(st.salaries&&st.salaries.length)||st.shop);
}

async function hydrateForUser(user){
  currentUser = user;
  let localState = null;
  if(persist&&db){
    try{localState = await idbGet('kv','state')}catch(e){}
  }
  let cloudRow = null;
  if(sb){
    const { data, error } = await sb
      .from('user_states')
      .select('state, updated_at')
      .eq('user_id', user.id)
      .maybeSingle();
    if(!error && data && data.state)cloudRow = data.state;
  }

  if(cloudRow){
    S = Object.assign(emptyState(), cloudRow);
    if(!S.imgUrls)S.imgUrls={};
    if(!S.depts.length)seed();
    if(persist&&db){try{await idbPut('kv','state',S)}catch(e){}}
    syncStatus='متصل بالسحابة';
  }else{
    if(localState && hasLocalShopData(localState)){
      S = Object.assign(emptyState(), localState);
      if(!S.imgUrls)S.imgUrls={};
      if(!S.depts.length)seed();
      await pushCloudState();
    }else{
      S = emptyState();
      seed();
      await pushCloudState();
    }
  }
}

  if(!email||!password){toast('اكتب البريد الإلكتروني وكلمة المرور');return}
  const btn=$('#auth_submit');if(btn)btn.disabled=true;
  try{
    if(authMode==='signup'){
      const { data, error } = await sb.auth.signUp({ email, password });
      if(error)throw error;
      if(data && data.session){
        await hydrateForUser(data.user);
        render();
        toast('تم إنشاء الحساب وتسجيل الدخول');
      }else{
        toast('تم إنشاء الحساب! راجع بريدك لتأكيد الحساب ثم سجل الدخول.');
        authMode='login';
        renderAuthScreen();
      }
    }else{
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error)throw error;
      await hydrateForUser(data.user);
      render();
      toast('تم تسجيل الدخول');
    }
  }catch(err){
    toast(err.message||'تعذر إتمام العملية');

function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)})}
function dataURLToBlob(u){const p=u.split(',');const m=/data:(.*?);/.exec(p[0]);const bin=atob(p[1]);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m?m[1]:'image/jpeg'})}

/* ---------- boot ---------- */
function seed(){S.depts=[{id:uid(),name:'دهانات',icon:'paint',img:null},{id:uid(),name:'كهربا',icon:'bolt',img:null},{id:uid(),name:'سباكة',icon:'drop',img:null},{id:uid(),name:'حديد',icon:'iron',img:null}];flush()}
async function boot(){
  try{
    const allowed = await checkRemoteAccess();
    if(!allowed) return;
  }catch(e){}

  try{
    db=await openDB();
    await idbLoadAllImgs();
  }catch(e){persist=false;db=null}

  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

  if(!sb){
    try{
      const st=persist&&db?await idbGet('kv','state').catch(()=>null):null;
      if(st)S=Object.assign(emptyState(),st);
      if(!S.depts.length)seed();
    }catch(e){}
    currentUser={email:'وضع محلي'};
    render();
    return;
  }

  try{
    const { data } = await sb.auth.getSession();
    const session = data && data.session;
    if(session && session.user){
      await hydrateForUser(session.user);
      render();
      return;
    }
  }catch(e){}

  renderAuthScreen();
}
boot();
})();
</script>

</body>
</html>
